<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>チュートリアルと通常の一日</title><style>body{margin:0;padding:24px;background:#090f0d}main{max-width:1100px;margin:auto}@media(max-width:600px){body{padding:0}}</style></head><body><main><style>
#island-tutorial{--ink:#eee9d8;--dim:#c2cbbf;--gold:#e1c578;--panel:#14231e;color:var(--ink);font:14px/1.7 "Yu Gothic UI","Meiryo",sans-serif;width:100%;color-scheme:dark;background:#101b17}

@media(max-width:700px){#island-tutorial .rule-grid{grid-template-columns:1fr}#island-tutorial .rule-option{gap:6px}#island-tutorial .rule-number{font-size:22px}#island-tutorial .rule-picker{padding:16px}#island-tutorial .night-status{margin:12px 16px 0;max-width:calc(100% - 32px)}}

#island-tutorial .sheet{position:relative;background:linear-gradient(135deg,#172a22,#101c19);width:calc(100% - 52px);max-width:880px;margin:24px auto 36px;padding:26px 28px;border:1px solid #b9b18780;box-shadow:0 16px 50px #0007}

#island-tutorial .sheet h3{font-size:25px;font-weight:500;letter-spacing:.05em;margin:4px 0}

#island-tutorial .training-bar{display:flex;gap:5px;margin:8px 0}

#island-tutorial .alchemy-card{background:#1e3027;border:1px solid #6b7c5b;padding:22px;margin-top:20px}

#island-tutorial .recipe-flow{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;gap:16px;padding:24px 0;text-align:center}

#island-tutorial .recipe-arrow{font:26px Georgia,serif;color:var(--gold)}
#island-tutorial .recipe-title{font-size:15px}
#island-tutorial .recipe-count{font-size:12px;color:var(--dim);margin-top:6px}
#island-tutorial .potion-bottle{position:relative;width:53px;height:64px;margin:8px auto 12px;border:2px solid #acb997;border-radius:8px 8px 18px 18px;background:linear-gradient(180deg,#516d5020 25%,#749b6860 27%,#739a67ad 95%)}
#island-tutorial .potion-bottle:before{content:"";position:absolute;left:13px;top:-12px;width:23px;height:10px;border:2px solid #acb997;border-bottom:0;background:#293e2e}

#island-tutorial .alchemy-actions,#island-tutorial .potion-stock{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #d7c69733;padding-top:16px;margin-top:16px}
#island-tutorial .alchemy-actions p,#island-tutorial .potion-stock p{font-size:12px;color:var(--dim);margin:0}

@media(max-width:600px){#island-tutorial .utility-nav{padding:10px 12px}#island-tutorial .sheet{padding:22px 16px}#island-tutorial .sheet h3{font-size:21px}#island-tutorial .sheet-foot,#island-tutorial .alchemy-actions,#island-tutorial .potion-stock{align-items:stretch;flex-direction:column}#island-tutorial .item-row{grid-template-columns:46px minmax(0,1fr);gap:12px}#island-tutorial .item-art{width:46px;height:46px}#island-tutorial .item-art img{width:43px}#island-tutorial .item-action{grid-column:2;flex-direction:row;justify-content:space-between;align-items:center}#island-tutorial .alchemy-card{padding:14px}#island-tutorial .alchemy-card h4{font-size:18px}#island-tutorial .recipe-flow{gap:7px;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr)}#island-tutorial .recipe-title{font-size:13px}#island-tutorial .potion-status{flex-basis:100%}}

<div id="island-tutorial">
  <header class="tutorial-head">
    <div><div class="eyebrow">TUTORIAL / GAME LOOP</div><h2>逃げ帰った夜、備えてもう一度海へ</h2></div>
    <div class="preview-note">画面・台詞は仮案</div>
  </header>
  <nav class="flow-switch" aria-label="確認する流れを切り替える">
    <button type="button" class="cursor-interaction" data-flow="tutorial" aria-pressed="true">チュートリアル</button>
    <button type="button" class="cursor-interaction" data-flow="daily" aria-pressed="false">通常の一日</button>
    <span class="flow-caption">島への到着から、初夜の遭遇と再出発まで</span>
  </nav>
  <nav class="chapters" aria-label="チュートリアルの場面を選ぶ">
    <button type="button" class="cursor-interaction" data-start="0">島に到着</button>
    <button type="button" class="cursor-interaction" data-start="1">昼の釣り</button>
    <button type="button" class="cursor-interaction" data-start="5">初めての夜</button>
    <button type="button" class="cursor-interaction" data-start="8">帰還と掟</button>
    <button type="button" class="cursor-interaction" data-start="14">交換</button>
    <button type="button" class="cursor-interaction" data-start="15">強化・調合</button>
    <button type="button" class="cursor-interaction" data-start="17">再出発</button>
  </nav>
  <nav class="utility-nav" aria-label="拠点メニュー">
    <button type="button" data-menu="rules" class="cursor-interaction" disabled>今夜の掟</button>
    <button type="button" data-menu="shop" class="cursor-interaction" disabled>交換所</button>
    <button type="button" data-menu="upgrade" class="cursor-interaction" disabled>自分の強化</button>
    <span class="potion-status" hidden>気配消し 有効 / 翌朝まで</span>
    <div class="wallet"><small>所持金</small><span>1,500</span></div>
  </nav>
  <div class="game-world" data-light="day">
  <img class="menu-landscape" hidden alt="">
  <div class="menu-grade" hidden></div>
  <div class="menu-hud" hidden><div><div class="menu-day"></div><div class="menu-clock"></div></div><div class="menu-place"><b></b><span class="menu-stock"></span></div></div>
  <section class="sheet" hidden aria-label="ゲーム背景の上に開くメニュー"></section>
  <section class="stage" aria-label="チュートリアルの画面見本">
    <img class="landscape" alt="">
    <div class="grade"></div><div class="danger-wash" hidden></div>
    <div class="hud"><div><div class="day">DAY <span class="day-number">01</span></div><div class="clock"></div></div><div class="location"><b></b><span class="belongings"></span></div></div>
    <div class="objective"><small>TUTORIAL</small><strong></strong></div>
    <div class="night-status" hidden aria-live="polite"><span class="quota-status"></span><span class="rule-status"></span></div>
    <div class="visual">
      <img class="being" alt="夜の海に現れた、黄色い目と触手を持つ上位存在" hidden>
      <div class="scene-sign" hidden><small></small><strong></strong></div>
      <div class="feature" hidden><img class="fish" alt="" hidden><strong></strong><p></p></div>
      <div class="ring" hidden>J</div>
      <section class="rule-picker" aria-label="チュートリアルの夜に選ぶ掟" hidden>
        <div class="eyebrow">RULE / CHOOSE ONE</div>
        <h3>守る掟を、ひとつ選ぶ</h3>
        <p>毎朝、3つの中から1つ選ぶ<br>選んだ掟は翌朝06:00まで有効</p>

    {title:'夜の拠点とラジオ',time:'19:00 · 夜',place:'拠点',bg:'camp',light:'night',goal:'ラジオに話しかけ、次の探索に備える',speaker:'ラジオ',line:'おかえり、無事に釣れたようだネ\n魚を売って道具を買うか、調合の材料にしてもいいんだヨ',next:'交換所を開く',kind:'sign',tag:'夜の拠点',sign:'次の探索に、備える'},
    {title:'交換所',time:'19:10 · 夜',place:'交換所',bg:'camp',light:'night',kind:'shop'},
    {title:'強化と魚の調合',time:'19:30 · 夜',place:'拠点',bg:'camp',light:'night',kind:'upgrade'},
    {title:'夜釣りへ出発',time:'20:00 · 夜',place:'拠点',bg:'camp',light:'night',goal:'準備を整えて夜の海へ向かう',speaker:'ラジオ',line:'準備はできたかい？\n夜の海でも、掟と周りの気配に気をつけてネ',next:'夜の海へ',kind:'sign',tag:'夜の出発',sign:'明かりの先に、夜の海'},
    {title:'夜の上位存在',time:'22:00 · 夜',place:'釣り場',bg:'fishing',light:'night',goal:'距離を取り、上位存在の気配をやり過ごす',speaker:'渚',line:'……何か、いる\n近づかずに、ここで気配が過ぎるのを待とう',next:'気配をやり過ごす',kind:'being',danger:true,tag:'上位存在',sign:'距離を取って、やり過ごす'},
    {title:'夜の釣り',time:'22:15 · 夜',place:'釣り場',bg:'fishing',light:'night',goal:'周囲を警戒しながら夜の魚を釣る',speaker:'渚',line:'この引きは、昼とは違う……！\n落ち着いて、引き上げよう',next:'J · 引き上げる',kind:'ring'},
    {title:'夜の異形の魚',time:'22:20 · 夜',place:'釣り場',bg:'fishing',light:'night',goal:'夜の釣果を持って帰る',speaker:'渚',line:'見たことのない魚だ\n……早く戻ろう',next:'拠点へ帰る',kind:'strange',feature:'バイオレットダンクルオステウス × 1',detail:'夜の海で釣れた、異形の魚'},
    {title:'明け方の帰還',time:'05:00 · 明け方',place:'拠点',bg:'camp',light:'dawn',goal:'ラジオに報告し、翌朝の掟選びへ',speaker:'ラジオ',line:'おかえり、夜の海はどうだった？\nお金と道具、強化は持ち越せるヨ。朝になったら、新しい掟を選ぼうか',next:'翌朝の掟を選ぶ →',kind:'sign',tag:'明け方の帰還',sign:'生きて帰り、次の一日へ'}
  ];
  const chapters = {
    tutorial:[['島に到着',0],['昼の釣り',1],['初めての夜',5],['帰還と掟',8],['交換',14],['強化・調合',15],['再出発',17]],
    daily:[['朝の掟',0],['昼の釣り',2],['帰還',5],['交換',7],['強化・調合',8],['夜の異変',10],['明け方',13]]
  };
  const rules = {
    fish:{name:'釣った魚を、海へ返すな',text:'釣った魚は捨てずに持ち帰る　納品・売却・調合はできる'},
    night:{name:'夜の海では、走るな',text:'夜の海辺では歩いて移動する　危険を感じても走らない'},
    radio:{name:'呼び声には、必ず応えよ',text:'拠点に戻ったら、まずラジオを調べる　話を聞いてから次の行動を選ぶ'}
  };
  const goods = [
    {id:'torch',name:'たいまつ',mark:'火',price:300,text:'暗い海辺を照らす、夜の探索用の道具'},
    {id:'bait',name:'釣り餌',mark:'餌',price:200,text:'魚を誘うための消耗品'},
    {id:'charm',name:'お守り',mark:'守',price:600,text:'島での探索に持ち歩く、小さなお守り'}
  ];
  const skills = [
    {id:'fishing',name:'釣りの腕',mark:'釣',text:'タイミングを合わせやすくする',effect:n=>`成功範囲 +${n*5}% → +${(n+1)*5}%`},
    {id:'legs',name:'足腰',mark:'歩',text:'島の中を移動しやすくする',effect:n=>`移動速度 +${n*5}% → +${(n+1)*5}%`},
    {id:'focus',name:'集中力',mark:'心',text:'魚がかかったときの余裕を増やす',effect:n=>`判定猶予 +${(n*.1).toFixed(1)}秒 → +${((n+1)*.1).toFixed(1)}秒`}
  ];
  const initial = () => ({day:1,money:1500,items:{aji:0,strange:0,torch:0,bait:0,charm:0,potion:0},levels:{fishing:0,legs:0,focus:0},caught:false,caughtDayFish:false,caughtNightFish:false,stealth:false,rule:null,candidate:null});
  const yen = value => value.toLocaleString('ja-JP');
  let sim = initial();
  let index = 0;
  let menu = null;
  let shopTab = 'buy';
  let upgradeTab = 'fish';
  let message = '';
  let mode = 'tutorial';
  let scenes = tutorialScenes;
  let views = {tutorial:null,daily:null};

  /// <summary>現在の場面と所持品を独立した復元情報として返す 引数なし 例 snapshot()</summary>
  function snapshot() {
    return JSON.parse(JSON.stringify({scene:index,sim,menu,shopTab,upgradeTab}));
  }

  /// <summary>流れの識別子を受け取り、各流れの進行を保ったまま切り替える 戻り値なし 例 switchFlow('daily')</summary>
  function switchFlow(nextMode) {
    if (!Object.hasOwn(chapters,nextMode) || mode === nextMode) return;
    views[mode] = snapshot();
    mode = nextMode;
    scenes = mode === 'tutorial' ? tutorialScenes : dailyScenes;
    if (views[mode]) restoreView(views[mode]);
    else {
      sim = initial(); shopTab = 'buy'; upgradeTab = 'fish'; render(0);
    }
    persist();
  }

  /// <summary>所持金とメニューの利用可否を更新する 引数なし 戻り値なし 例 updateChrome()</summary>
  function updateChrome() {
    q('.wallet span').textContent = yen(sim.money);
    q('.potion-status').hidden = !sim.stealth;
    root.querySelectorAll('[data-menu]').forEach(button => { button.disabled = !sim.rule || (mode === 'tutorial' && index < 14); });
    q('[data-menu="rules"]').textContent = mode === 'tutorial' ? sim.rule ? '今夜の掟 ✓' : '今夜の掟' : sim.rule ? '今日の掟 ✓' : '今日の掟';
  }

  /// <summary>操作状態をホストへ保存する 引数なし 戻り値なし 例 persist()</summary>
  function persist() {
    views[mode] = snapshot();
    window.openai?.setWidgetState?.({modelContent:{flowVersion:4,mode:mode === 'tutorial'?'チュートリアル':'通常の一日',day:sim.day,scene:scenes[index].title,rule:sim.rule ? rules[sim.rule].name : null,money:sim.money,items:{...sim.items},stealth:sim.stealth},privateContent:{unifiedVersion:4,mode,views}})?.catch(() => {});
  }

  /// <summary>場面番号を受け取り会話または交換・強化を表示する 戻り値なし 例 render(14)</summary>
  function render(nextIndex) {
    index = Number.isInteger(nextIndex) ? Math.max(0,Math.min(nextIndex,scenes.length-1)) : 0;
    if (!sim.rule && (mode === 'tutorial' ? index > 13 : index > 0)) index = mode === 'tutorial' ? 13 : 0;

    // 昼の魚は一度だけ入手し、売却や調合後に場面を見直しても増やさない
    if (mode === 'tutorial' && index >= 2 && !sim.caught) {
      sim.items.aji += 1;
      sim.caught = true;
    }
    if (mode === 'daily') {
      if (index >= 4 && !sim.caughtDayFish) {sim.items.aji += 1;sim.caughtDayFish = true;}
      if (index >= 12 && !sim.caughtNightFish) {sim.items.strange += 1;sim.caughtNightFish = true;}
    }
    const scene = scenes[index];
    menu = null;
    message = '';
    q('.sheet').hidden = true;
    q('.stage').hidden = false;
    q('.menu-landscape').hidden = true;
    q('.menu-grade').hidden = true;
    q('.menu-hud').hidden = true;
    q('.game-world').dataset.light = scene.light;
    q('.stage').dataset.light = scene.light;
    q('.stage').dataset.danger = !!scene.danger;
    q('.landscape').src = assets[scene.bg];
    q('.landscape').alt = scene.bg === 'camp' ? '島の拠点とラジオ、集荷所' : '主人公が立つ桟橋と海';
    q('.day-number').textContent = String(sim.day + (mode === 'daily' && scene.light === 'dawn' ? 1 : 0)).padStart(2,'0');
    q('.clock').textContent = scene.time;
    q('.location b').textContent = scene.place;
    q('.belongings').textContent = `魚 × ${sim.items.aji+sim.items.strange} · 道具 × ${sim.items.torch+sim.items.bait+sim.items.charm}`;
    q('.objective strong').textContent = scene.goal || '';
    q('.objective small').textContent = mode === 'tutorial' ? 'TUTORIAL' : 'いまの目的';
    q('.speaker').textContent = scene.speaker || '';
    q('.line').textContent = scene.line || '';
    q('.stage .advance').textContent = scene.kind === 'choose' && sim.candidate ? 'この掟で確定する' : scene.next || '';
    q('.stage .advance').disabled = scene.kind === 'choose' && !sim.candidate;
    q('.step-label').textContent = scene.title;
    q('.counter').textContent = `${index+1} / ${scenes.length}`;
    q('.back').disabled = index === 0;

    // 初回遭遇は夜のまま撤退し、夜の魚の獲得や翌朝への遷移を入れない
    q('.visual').dataset.kind = scene.kind;
    q('.danger-wash').hidden = !scene.danger;
    q('.being').hidden = !['being','retreat'].includes(scene.kind);
    q('.being').src = assets.being;
    q('.scene-sign').hidden = !scene.sign;
    q('.scene-sign small').textContent = scene.tag || '';
    q('.scene-sign strong').textContent = scene.sign || '';
    q('.feature').hidden = !scene.feature;
    q('.feature strong').textContent = scene.feature || '';
    q('.feature p').textContent = scene.detail || '';
    q('.fish').hidden = !['catch','strange'].includes(scene.kind);
    q('.fish').src = scene.kind === 'strange' ? assets.strange : assets.aji;
    q('.fish').alt = scene.kind === 'strange' ? '夜に釣った紫色の異形の魚' : '昼に釣ったアジ';
    q('.ring').hidden = scene.kind !== 'ring';
    q('.night-status').hidden = mode === 'tutorial' ? index < 11 : !sim.rule;
    q('.quota-status').hidden = mode === 'daily';
    q('.quota-status').textContent = 'ノルマ · 魚の納品 0 / 1 · 翌朝06:00まで';
    q('.rule-status').textContent = mode === 'daily' ? sim.rule ? `今日の掟：${rules[sim.rule].name}` : '' : sim.rule && index >= 13 ? `今夜の掟：${rules[sim.rule].name}` : index >= 13 ? '今夜の掟：未確定' : '';
    q('.rule-picker').hidden = scene.kind !== 'choose';
    q('.rule-picker').setAttribute('aria-label',mode === 'tutorial' ? 'チュートリアルの夜に選ぶ掟' : '毎朝選ぶ今日の掟');
    q('.rule-timing').textContent = mode === 'tutorial' ? 'チュートリアルの今回は、特別に夜に選ぶ' : '通常の一日は、朝に新しい掟を選んでから出発する';
    root.querySelectorAll('[data-rule]').forEach(button => {
      button.disabled = !!sim.rule;
      button.setAttribute('aria-pressed',String(button.dataset.rule === sim.candidate));
      button.querySelector('.rule-check').textContent = button.dataset.rule === sim.candidate ? sim.rule ? '✓ 守る掟として確定済み' : '✓ この掟を選択中' : 'この掟を選ぶ';
    });
    q('.tutorial-head h2').textContent = mode === 'tutorial' ? '逃げ帰った夜、備えてもう一度海へ' : '掟を選び、今日を生き延びる';
    q('.flow-caption').textContent = mode === 'tutorial' ? '島への到着から、初夜の遭遇と再出発まで' : '朝の掟選びから、釣り・準備・翌朝への帰還まで';
    root.querySelectorAll('[data-flow]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.flow === mode)));
    q('.chapters').replaceChildren();
    for (const [name,at] of chapters[mode]) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'cursor-interaction'; button.dataset.start = at; button.textContent = name;
      q('.chapters').append(button);
    }
    const starts = [...root.querySelectorAll('[data-start]')];
    starts.forEach((button,n) => button.setAttribute('aria-pressed',String(index >= +button.dataset.start && index < +(starts[n+1]?.dataset.start || scenes.length))));
    updateChrome();

    // 掟の直後に交換所、次に強化を順番に開く
    if (['shop','upgrade'].includes(scene.kind)) {
      menu = {type:scene.kind,flow:true};
      drawMenu();
    }
  }

  /// <summary>場面番号を受け取り表示と保存を更新する 戻り値なし 例 navigate(5)</summary>
  function navigate(nextIndex) {
    render(nextIndex);
    persist();
  }

  /// <summary>次の場面へ進むか、最後なら全状態を最初に戻す 引数なし 戻り値なし 例 advance()</summary>
  function advance() {
    if (scenes[index].kind === 'choose') {
      if (!sim.candidate) return;
      sim.rule = sim.candidate;
    }
    if (index === scenes.length-1 && mode === 'tutorial') {
      switchFlow('daily');
    } else if (index === scenes.length-1) {
      sim.day += 1;
      sim.rule = null; sim.candidate = null; sim.stealth = false;
      sim.caughtDayFish = false; sim.caughtNightFish = false;
      navigate(0);
    } else navigate(index+1);
  }

  /// <summary>魚の調合とポーション使用の画面内容を返す 引数なし 例 alchemyMarkup()</summary>
  function alchemyMarkup() {
    return `<div class="alchemy-card"><div class="eyebrow">FISH ALCHEMY / 魚を直接使う</div><h4>気配消しのポーション</h4><p class="item-copy">魚をすりつぶして調合し、敵に気づかれにくくなる薬を作る</p><div class="recipe-flow"><div><img class="recipe-fish" src="${assets.aji}" alt="材料になるアジ"><div class="recipe-title">アジ ×1匹</div><div class="recipe-count">所持 ${sim.items.aji}匹</div></div><div class="recipe-arrow">→</div><div><div class="potion-bottle" aria-hidden="true"></div><div class="recipe-title">気配消しのポーション ×1本</div><div class="recipe-count">所持 ${sim.items.potion}本</div></div></div><div class="alchemy-actions"><p>アジ1匹を消費して、ポーション1本を入手<br>所持金は使わない</p><button type="button" class="advance cursor-interaction" data-action="brew" ${sim.items.aji<1?'disabled':''}>${sim.items.aji<1?'アジが足りない':'魚をすりつぶして調合'}</button></div></div><div class="potion-stock"><div><h4>できたポーションを使う</h4><p>所持 ${sim.items.potion}本 · 使用すると1本消費<br>効果は翌朝まで　重ねがけはできない</p></div><button type="button" class="cursor-interaction" data-action="drink" ${sim.stealth||sim.items.potion<1?'disabled':''}>${sim.stealth?'気配消し 効果中':sim.items.potion<1?'ポーション未所持':'1本使う'}</button></div><div class="effect-preview"><span>敵への見つかりやすさ<br>${sim.stealth?'気配消し 有効 / 翌朝まで':'使用すると通常より30%低下'}</span><strong>${sim.stealth?'70%':'100% → 70%'}</strong></div>`;
  }

  /// <summary>既存モックの交換・強化・掟確認の画面を表示する 引数なし 戻り値なし 例 drawMenu()</summary>
  function drawMenu() {
    const type = menu.type;
    const title = {shop:'お金と物を交換する',upgrade:'自分を強化する',rules:mode === 'tutorial' ? '今夜、守るべき掟' : '今日、守るべき掟'}[type];
    let content = '';
    if (type === 'shop') {
      const entries = shopTab === 'buy' ? goods : [{id:'aji',name:'アジ',price:400,text:'昼に釣った魚　売却か調合に使える',img:assets.aji},{id:'strange',name:'バイオレットダンクルオステウス',price:1000,text:'夜の海で釣れる異形の魚',img:assets.strange}];
      content = `<div class="shop-tabs" aria-label="購入と売却"><button type="button" class="cursor-interaction" data-tab="buy" aria-pressed="${shopTab==='buy'}">購入する</button><button type="button" class="cursor-interaction" data-tab="sell" aria-pressed="${shopTab==='sell'}">売却する</button></div><div class="item-list">${entries.map(item => {
        const blocked = shopTab === 'buy' ? sim.money<item.price : sim.items[item.id]<1;
        return `<div class="item-row"><div class="item-art">${item.img?`<img src="${item.img}" alt="${item.name}">`:item.mark}</div><div><h4 class="item-name">${item.name}</h4><p class="item-copy">${item.text}</p><span class="item-count">所持数 ${sim.items[item.id]}</span></div><div class="item-action"><span class="price">${yen(item.price)}</span><button type="button" class="cursor-interaction" data-trade="${item.id}" ${blocked?'disabled':''}>${blocked ? shopTab==='buy'?'所持金が足りない':'売却できる魚なし' : shopTab==='buy'?'1個購入する':'1匹売却する'}</button></div></div>`;
      }).join('')}</div>`;
    } else if (type === 'upgrade') {
      const tabs = `<div class="shop-tabs" aria-label="強化方法"><button type="button" class="cursor-interaction" data-upgrade-tab="fish" aria-pressed="${upgradeTab==='fish'}">魚で調合</button><button type="button" class="cursor-interaction" data-upgrade-tab="money" aria-pressed="${upgradeTab==='money'}">お金で能力強化</button></div>`;
      content = tabs + (upgradeTab === 'fish' ? alchemyMarkup() : `<div class="training-intro">能力は3段階まで強化可能　道具の購入と同じ所持金を使う</div><div class="item-list">${skills.map(skill => {
        const level = sim.levels[skill.id], cost = 400+level*200, max = level>=3;
        return `<div class="item-row"><div class="item-art">${skill.mark}</div><div><h4 class="item-name">${skill.name}<span class="item-count">Lv.${level} / 3</span></h4><p class="item-copy">${skill.text}</p><div class="training-bar" role="img" aria-label="強化レベル${level}、最大3">${[0,1,2].map(n=>`<span class="${n<level?'lit':''}"></span>`).join('')}</div><p class="item-copy">${max?'最大まで強化済み':skill.effect(level)}</p></div><div class="item-action"><span class="price">${max?'MAX':yen(cost)}</span><button type="button" class="cursor-interaction" data-upgrade="${skill.id}" ${max||sim.money<cost?'disabled':''}>${max?'最大レベル':sim.money<cost?'所持金が足りない':'強化する'}</button></div></div>`;
      }).join('')}</div>`);
    } else {
      const rule = rules[sim.rule];
      const duration = mode === 'tutorial' ? '今夜、確定した時点から翌朝06:00まで<br>普段は毎朝選ぶ　チュートリアルの今回は夜に選択' : `DAY ${sim.day} の朝から DAY ${sim.day+1} の朝06:00まで<br>次の朝には、新しい掟を3つから選ぶ`;
      content = `<div class="rule-record"><h4>${rule.name}</h4><p>${rule.text}</p><p class="item-copy">有効期間：${duration}</p></div>`;
    }
    const action = menu.flow ? type === 'shop' ? '自分の強化へ →' : mode === 'tutorial' ? '出発の準備を終える →' : '夜釣りの案内へ →' : '元の画面へ戻る →';
    const shownDay = sim.day + (mode === 'daily' && scenes[index].light === 'dawn' ? 1 : 0);
    const ruleInfo = `${mode === 'tutorial'?'ノルマ：魚の納品 0 / 1 · 翌朝06:00まで<br>':''}${mode === 'tutorial'?'今夜':'今日'}の掟：${rules[sim.rule].name}`;
    q('.sheet').innerHTML = `<div class="sheet-head"><div class="eyebrow">${type==='shop'?'COLLECTION POINT / EXCHANGE':type==='upgrade'?'PERSONAL GROWTH':'CURRENT RULE'} · DAY ${String(shownDay).padStart(2,'0')} / ${scenes[index].time}</div><h3>${title}</h3><p class="sheet-intro">${type==='shop'?'魚を売ってお金に換え、必要な品物を購入する':type==='upgrade'?'お金で能力を伸ばすか、魚を直接使ってポーションを調合する':'選んだ掟を確認してから行動しよう'}</p><p class="sheet-intro">${ruleInfo}</p></div>${content}<div class="sheet-foot"><p>昼の魚は売却か調合に使える<br>内容・価格・効果は仮　購入や強化をせず進んでもよい</p><button type="button" class="advance cursor-interaction" data-action="close">${action}</button></div><div class="sheet-message" role="status" aria-live="polite"></div>`;
    q('.sheet-message').textContent = message;
    q('.sheet').hidden = false;
    q('.stage').hidden = true;

    // 開いていた場面の背景と日時を残し、その上に共通のメニューを重ねる
    const scene = scenes[index];
    q('.menu-landscape').src = assets[scene.bg];
    q('.menu-landscape').alt = scene.bg === 'camp' ? 'メニューの周囲に見える拠点と海辺' : 'メニューの周囲に見える釣り場の海';
    q('.menu-landscape').hidden = false;
    q('.menu-grade').hidden = false;
    q('.menu-hud').hidden = false;
    q('.menu-day').textContent = `DAY ${String(shownDay).padStart(2,'0')}`;
    q('.menu-clock').textContent = scene.time;
    q('.menu-place b').textContent = scene.place;
    q('.menu-stock').textContent = `魚 × ${sim.items.aji+sim.items.strange} · 道具 × ${sim.items.torch+sim.items.bait+sim.items.charm}`;
    updateChrome();
  }

  /// <summary>クリックを受け取り売買や強化を行う 戻り値なし 例 handleClick(event)</summary>
  function handleClick(event) {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.disabled) return;
    if (button.dataset.flow) {switchFlow(button.dataset.flow);return;}
    if (button.dataset.start !== undefined) {navigate(+button.dataset.start);return;}
    if (button.dataset.rule && !sim.rule) {
      sim.candidate = button.dataset.rule;
      navigate(index);
      return;
    }
    if (button.dataset.menu) {
      menu = {type:button.dataset.menu,flow:false};
      message = '';
    } else if (!menu) return;
    else if (button.dataset.action === 'close') {
      if (menu.flow) advance(); else navigate(index);
      return;
    } else if (button.dataset.tab) { shopTab = button.dataset.tab; message = ''; }
    else if (button.dataset.upgradeTab) { upgradeTab = button.dataset.upgradeTab; message = ''; }
    else if (button.dataset.action === 'brew' && sim.items.aji>0) {
      sim.items.aji -= 1; sim.items.potion += 1;
      message = 'アジ1匹をすりつぶして調合した / ポーション ＋1本';
    } else if (button.dataset.action === 'drink' && sim.items.potion>0 && !sim.stealth) {
      sim.items.potion -= 1; sim.stealth = true;
      message = 'ポーションを使った / 翌朝まで敵に見つかりにくい';
    } else if (button.dataset.trade) {
      const id = button.dataset.trade;
      const item = goods.find(entry=>entry.id===id);
      if (shopTab==='buy' && item && sim.money>=item.price) {
        sim.money -= item.price; sim.items[id] += 1;
        message = `${item.name}を1個購入した / −${yen(item.price)}`;
      } else if (shopTab==='sell' && ['aji','strange'].includes(id) && sim.items[id]>0) {
        const price = id==='aji'?400:1000;
        sim.money += price; sim.items[id] -= 1;
        message = `魚を1匹売却した / ＋${yen(price)}`;
      }
    } else if (button.dataset.upgrade) {
      const skill = skills.find(entry=>entry.id===button.dataset.upgrade);
      if (!skill) return;
      const level = sim.levels[skill.id], cost = 400+level*200;
      if (level>=3 || sim.money<cost) return;
      sim.money -= cost; sim.levels[skill.id] += 1;
      message = `${skill.name}が Lv.${level+1} になった / −${yen(cost)}`;
    } else return;
    drawMenu();
    persist();
  }

  /// <summary>一つの流れの保存情報を検証し復元する 戻り値なし 例 restoreView(views.daily)</summary>
  function restoreView(data) {
    if (!data?.sim) {sim = initial();render(0);return;}
    const source = data.sim;
    sim = initial();
    const bounded = (value,max) => Number.isFinite(value) ? Math.max(0,Math.min(max,Math.floor(value))) : 0;
    sim.money = bounded(source.money,1000000);
    sim.day = bounded(source.day,9999) || 1;
    for (const id of Object.keys(sim.items)) sim.items[id] = bounded(source.items?.[id],999);
    for (const id of Object.keys(sim.levels)) sim.levels[id] = bounded(source.levels?.[id],3);
    sim.caught = source.caught === true;
    sim.caughtDayFish = source.caughtDayFish === true;
    sim.caughtNightFish = source.caughtNightFish === true;
    sim.stealth = source.stealth === true;
    sim.rule = Object.hasOwn(rules,source.rule) ? source.rule : null;
    sim.candidate = sim.rule || (Object.hasOwn(rules,source.candidate) ? source.candidate : null);
    shopTab = data.shopTab==='sell'?'sell':'buy';
    upgradeTab = data.upgradeTab==='money'?'money':'fish';
    render(data.scene);
    if (sim.rule && (mode === 'daily' || index>=14) && ['shop','upgrade','rules'].includes(data.menu?.type)) {
      menu = {type:data.menu.type,flow:data.menu.flow===true && data.menu.type===scenes[index].kind};
      drawMenu();
    }
  }

  /// <summary>二つの流れを含む保存情報を復元する 戻り値なし 例 restore(window.openai.widgetState)</summary>
  function restore(state) {
    const data = state?.privateContent;
    if (data?.unifiedVersion === 3 && data.sim) {
      mode = 'tutorial'; scenes = tutorialScenes;
      views = {tutorial:data,daily:null}; restoreView(data);
    } else if (data?.unifiedVersion === 4) {
      mode = data.mode === 'daily' ? 'daily' : 'tutorial';
      scenes = mode === 'daily' ? dailyScenes : tutorialScenes;
      views = {tutorial:data.views?.tutorial || null,daily:data.views?.daily || null};
      restoreView(views[mode]);
    }
  }

  q('.stage .advance').addEventListener('click',advance);
  q('.back').addEventListener('click',()=>navigate(index-1));
  q('.restart').addEventListener('click',()=>{
    sim = initial();shopTab = 'buy';upgradeTab = 'fish';navigate(0);
  });
  root.addEventListener('click',handleClick);
  root.addEventListener('keydown',event=>{
    if (event.key.toLowerCase()==='j' && !menu && scenes[index].kind==='ring' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey) {
      event.preventDefault(); advance();
    }
  });
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  render(0);
  restore(window.openai?.widgetState);
})();
</script>
</main></body></html>
